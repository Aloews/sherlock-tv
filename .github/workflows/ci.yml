name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Отдельным шагом от сборки: падение типов и падение сборки — разные
      # поводы, и по названию шага должно быть видно, какой именно.
      - run: node scripts/check-i18n.mjs
      - run: npx vitest run
      - run: npx vite build
