name: Generate committed Cargo lockfile

on:
  push:
    branches: [feature/first-playable-api]

permissions:
  contents: write

concurrency:
  group: lockfile-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- Cargo.lock)" ]; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: commit Cargo dependency lockfile"
          git push
