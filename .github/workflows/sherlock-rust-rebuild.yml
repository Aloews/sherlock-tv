name: Sherlock Rust Rebuild CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [rebuild/civilization-simulation-v1]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sherlock
          POSTGRES_PASSWORD: sherlock
          POSTGRES_DB: sherlock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sherlock -d sherlock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sherlock:sherlock@localhost:5432/sherlock
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
