[workspace]
resolver = "2"
members = ["crates/domain", "crates/simulation"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
rand = "0.9"
rand_chacha = "0.9"
