services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sherlock
      POSTGRES_PASSWORD: sherlock
      POSTGRES_DB: sherlock
    ports: ["5432:5432"]
    volumes: ["sherlock_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sherlock -d sherlock"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  sherlock_pg:
