<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MatchLive</title>
    <meta name="description" content="Спортивные телеканалы в прямом эфире." />
    <!-- Тот же знак, что в заголовке (src/shared/ui/Logo.tsx): окружность-мяч и
         треугольник воспроизведения. data-URI, а не файл, — чтобы вкладка и
         заголовок не разъехались по отдельным правкам. Цвет зашит: в favicon
         currentColor наследовать не от чего, а кавычки внутри — одинарные:
         двойные оборвали бы href на первой же. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' stroke='%23FF8A3D' stroke-width='2.5' fill='none'/><path d='M13.5 10.5 L23 16 L13.5 21.5 Z' fill='%23FF8A3D'/></svg>" />
    <!-- Скрипт Mini App подключён, но приложение НЕ требует Telegram: внутри
         клиента появляются хаптика и системный переход по ссылке, снаружи —
         вибрация и window.open. См. src/shared/lib/telegram.ts. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
